---
title: T-verdi kalkulator
description: Finn kritisk t-verdi ut fra frihetsgrader, signifikansnivå og om testen er ensidig eller tosidig.
---

<form class="form" id="tform">
  <div class="field">
    <label for="df">Frihetsgrader (df)</label>
    <input type="number" id="df" min="1" required>
  </div>

  <div class="field">
    <label for="alpha">Signifikansnivå (α)</label>
    <input type="number" id="alpha" step="0.001" min="0" max="1" placeholder="f.eks. 0.05" required>
  </div>

  <fieldset class="field">
    <legend>Testtype</legend>
    <div class="choices">
      <label><input type="radio" name="testType" value="tosidig" checked> Tosidig test</label>
      <label><input type="radio" name="testType" value="ensidig"> Ensidig test</label>
    </div>
  </fieldset>

  <div><button class="btn" type="submit">Beregn t-verdi</button></div>

  <div class="result" id="result" aria-live="polite"></div>
  <div class="error" id="error"></div>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.5/jstat.min.js"></script>
<script>
  document.getElementById("tform").addEventListener("submit", function (e) {
    e.preventDefault();
    const df = parseInt(document.getElementById("df").value);
    const alpha = parseFloat(document.getElementById("alpha").value);
    const testType = document.querySelector('input[name="testType"]:checked').value;
    const result = document.getElementById("result");
    const error = document.getElementById("error");

    result.textContent = "";
    error.textContent = "";

    if (isNaN(df) || isNaN(alpha) || df <= 0 || alpha <= 0 || alpha >= 1) {
      error.textContent = "Vennligst skriv inn gyldige verdier.";
      return;
    }

    const adjustedAlpha = (testType === "tosidig") ? alpha / 2 : alpha;
    const tValue = jStat.studentt.inv(1 - adjustedAlpha, df);
    result.textContent = "t = " + tValue.toFixed(4);
  });
</script>
