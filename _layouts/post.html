---
layout: default
---
<!-- Mal for blogginnlegg (alle filer i blog/). Bygger på default.html. -->
<article class="post">
  <p class="back"><a href="{{ '/blogg.html' | relative_url }}">← Alle innlegg</a></p>
  <h1>{{ page.title }}</h1>
  {% if page.date %}<p class="meta">{{ site.author }} · {{ page.date | date: '%d.%m.%Y' }}</p>{% endif %}
  {{ content }}
</article>
