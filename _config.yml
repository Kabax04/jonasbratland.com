# ------------------------------------------------------------
# Innstillinger for hele nettsiden
# ------------------------------------------------------------

title: jonasbratland.com
tagline: Kunnskap er bortkastet hvis den ikke deles.
author: Jonas Bratland
email: web@jonasbratland.com
github: Kabax04
lang: no

# Standardverdier, så du slipper å skrive det samme i hver fil.
defaults:
  # Alle sider bruker layouten _layouts/default.html ...
  - scope:
      path: ""
    values:
      layout: default
  # ... bortsett fra filer i blog/, som bruker _layouts/post.html
  - scope:
      path: "blog"
    values:
      layout: post
  # ... og filer i tools/, som bruker _layouts/tool.html
  - scope:
      path: "tools"
    values:
      layout: tool

# Markdown på samme måte som GitHub
markdown: kramdown
kramdown:
  input: GFM

# Gjør [lenke](side.md) om til side.html (GitHub Pages har denne på fra før)
#   og redirect_from: lar gamle adresser sende videre til nye
plugins:
  - jekyll-relative-links
  - jekyll-redirect-from

# Filer som ikke skal bli en del av nettsiden
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
